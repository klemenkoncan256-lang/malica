<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malica – Gimnazija Vič</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F5F9;--text:#101828;--muted:#5B6478;--rule:#D5DAE5;--hero:#2F4BFF;--butter:#FFD95A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1220;--text:#EEF1FA;--muted:#9AA3BD;--rule:#252B42;--hero:#3A55FF}}
:root[data-theme="dark"]{--bg:#0E1220;--text:#EEF1FA;--muted:#9AA3BD;--rule:#252B42;--hero:#3A55FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:22px 16px 48px}
header h1{font-size:1.1rem;font-weight:800;margin:0}
header p{margin:0 0 18px;color:var(--muted);font-size:.9rem}

.hero{background:var(--hero);color:#fff;border-radius:28px;padding:22px 20px 14px;animation:rise .5s ease-out both}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.hero .when{margin:0;font-size:.95rem;opacity:.85}
.hero h2{margin:0;font-size:clamp(2.2rem,11.5vw,3.5rem);line-height:1;font-weight:800;letter-spacing:-.02em}
.hero .date{margin:6px 0 0;opacity:.85}
.plate{flex:none;width:64px;height:64px;border-radius:50%;background:var(--butter);box-shadow:inset 0 0 0 8px var(--butter),inset 0 0 0 10px rgba(16,24,40,.18)}
.hero ul{list-style:none;margin:0;padding:0}
.hero li{font-size:1.25rem;font-weight:600;padding:12px 0;border-top:1px solid rgba(255,255,255,.3)}

.weekhead{font-size:.95rem;font-weight:600;color:var(--muted);margin:30px 0 4px}
.row{display:grid;grid-template-columns:6.5rem 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.row.past{opacity:.5}
.row .d b{display:block;font-weight:800}
.row .d span{color:var(--muted);font-size:.85rem}
.row ul{list-style:none;margin:0;padding:0}
.row li{margin:2px 0}
.empty{color:var(--muted);margin:0}
footer{margin-top:26px;color:var(--muted);font-size:.8rem}
footer a{color:var(--text)}
a:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
</style>
</head>
<body>
<main>
<header><h1>Malica</h1><p>Gimnazija Vič, navadna malica</p></header>
<section class="hero" id="hero" aria-live="polite"></section>
<h2 class="weekhead" id="week"></h2>
<div id="list"></div>
<footer>Neuradno. Vir: <a id="src" href="https://www.gimvic.org/delovanjesole/solske_sluzbe_in_solski_organi/solska_prehrana/">gimvic.org</a>. * živilo iz ekološke pridelave. Med odmori je sadje na hodnikih.</footer>
</main>
<script>
// Fallback copy of this week's menu, used if menu.json can't be loaded.
const FALLBACK={week:"jedilnik MALICA - 5. 10. - 9. 10. 2026",
source:"https://www.gimvic.org/delovanjesole/solske_sluzbe_in_solski_organi/solska_prehrana/files/jedilnik-M-2026-10-5.pdf",
days:[
{n:"Ponedeljek",d:"2026-10-05",items:["korenina s slanino in sezamom (NV 2 kos)","jog. napitek (nar., sadni)"]},
{n:"Torek",d:"2026-10-06",items:["temna makovka (v, m)","zašinek, sir, list solate","skuta / jogurt","3. letnik: malica na ekskurziji za naročene"]},
{n:"Sreda",d:"2026-10-07",items:["rezine mlečnega kruha *","različni namazi","jogurt / mleko","rezine ananasa"]},
{n:"Četrtek",d:"2026-10-08",items:["temna štručka (v, m)","telečja hrenovka *","smuti"]},
{n:"Petek",d:"2026-10-09",items:["focaccia","kepice mocarele","češnjev paradižnik","lučka"]}]};
const MONTHS=["januarja","februarja","marca","aprila","maja","junija","julija","avgusta","septembra","oktobra","novembra","decembra"];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pad=n=>String(n).padStart(2,"0"),t=new Date();
const today=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
const parts=d=>d?d.split("-").map(Number):null;
const items=a=>a&&a.length?a.map(i=>`<li>${esc(i)}</li>`).join(""):'<li class="empty">Ni podatkov</li>';

function show(m){
 const days=m.days;
 let idx=days.findIndex(x=>x.d===today),label="Danes";
 if(idx<0){idx=days.findIndex(x=>x.d>today);label="Naslednja malica";}
 if(idx<0){idx=0;label="Ta teden";}
 const h=days[idx],p=parts(h.d);
 document.getElementById("hero").innerHTML=
  `<div class="top"><div><p class="when">${label}</p><h2>${esc(h.n)}</h2>${p?`<p class="date">${p[2]}. ${MONTHS[p[1]-1]}</p>`:""}</div><span class="plate" aria-hidden="true"></span></div><ul>${items(h.items)}</ul>`;
 document.getElementById("week").textContent=m.week.replace(/^jedilnik MALICA\s*-\s*/i,"Teden ").replace(/\s-\s/g," do ");
 if(m.source)document.getElementById("src").href=m.source;
 document.getElementById("list").innerHTML=days.map((x,i)=>{
  if(i===idx)return "";
  const q=parts(x.d);
  return `<div class="row${x.d&&x.d<today?" past":""}"><div class="d"><b>${esc(x.n)}</b><span>${q?q[2]+". "+q[1]+".":""}</span></div><ul>${items(x.items)}</ul></div>`;}).join("");
}
show(FALLBACK);
fetch("menu.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(m=>{if(m&&m.days&&m.days.length)show(m);}).catch(()=>{});
</script>
</body>
</html>
