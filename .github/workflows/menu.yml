name: Update malica menu
on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday 05:00 UTC
  workflow_dispatch:          # lets you run it by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pdfplumber
      - run: python fetch_menu.py
      - name: Commit if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git diff --cached --quiet || (git commit -m "Update menu" && git push)
